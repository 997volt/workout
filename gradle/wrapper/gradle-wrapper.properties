distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-bin.zip
distributionSha256Sum=0b00b0ffe07c4d4789c12d4935a44a7057d55774b7540bd4a3f76f336deb177a
networkTimeout=10000
# Retry a failed distribution download rather than failing the whole build on a flaky
# connection. The wrapper validates the downloaded distribution against Gradle's published
# checksum below, so retrying cannot substitute a different artifact.
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
