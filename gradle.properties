# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache. CI passes `--configuration-cache` explicitly on its one
# combined invocation; switching it on here gives an ordinary local `./gradlew` the same
# reuse, so the flag and the setting cannot drift apart. This build supports it — AGP 9,
# Hilt and KSP included — and Gradle asks for it in every log line.
org.gradle.configuration-cache=true

# AndroidX is required by all Jetpack dependencies.
android.useAndroidX=true

# Official Kotlin code style.
kotlin.code.style=official

# Kotlin/JS (ROADMAP N170): the shared core's node test target.
#
# The machine already has node and npm, and the settings repositories are sealed
# (`FAIL_ON_PROJECT_REPOS`), which the plugin's own node download would break by adding a
# project repository. The download is turned off in the root build script and this picks npm
# over a downloaded Yarn; neither touches the app's dependency graph.
kotlin.js.yarn=false

