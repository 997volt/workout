<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src data:; connect-src 'none'">
  <title>Import helper tests</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tests-page">
  <main id="testRoot">
    <h1>Import helper tests</h1>
    <p class="hint">
      Pure-function assertions, run in this browser against <code>app.js</code>. No framework,
      no network, no test data leaves the page.
    </p>
    <p id="testSummary" class="test-summary" role="status">Running…</p>
    <p><button type="button" id="rerun">Run again</button></p>
    <ol id="testResults" class="test-results"></ol>
  </main>

  <script src="fixtures/progress-series.js"></script>
  <script src="seed-catalog.js"></script>
  <script src="app.js"></script>
  <script>
(function () {
  'use strict';

  var H = window.ImportHelper;
  var passes = 0;
  var failures = 0;
  var results = [];

  function record(name, ok, error) {
    if (ok) {
      passes += 1;
      results.push({ name: name, ok: true, error: null });
    } else {
      failures += 1;
      results.push({ name: name, ok: false, error: error || 'assertion failed' });
    }
  }

  function check(name, body) {
    try {
      body();
      record(name, true, null);
    } catch (error) {
      record(name, false, error && error.message ? error.message : String(error));
    }
  }

  function ok(value, message) {
    if (!value) { throw new Error(message || 'expected a truthy value'); }
  }

  function eq(actual, expected, message) {
    if (actual !== expected) {
      throw new Error((message ? message + ': ' : '') +
        'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
    }
  }

  function close(actual, expected, epsilon, message) {
    if (typeof actual !== 'number' || Math.abs(actual - expected) > epsilon) {
      throw new Error((message ? message + ': ' : '') +
        'expected about ' + expected + ', got ' + actual);
    }
  }

  function findAt(list, path, pattern) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].path !== path) { continue; }
      if (!pattern || pattern.test(list[i].message)) { return list[i]; }
    }
    return null;
  }

  function expectAt(list, path, pattern, label) {
    var found = findAt(list, path, pattern);
    if (!found) {
      throw new Error((label || 'problem') + ' at ' + path +
        (pattern ? ' matching ' + pattern : '') + '; got ' +
        JSON.stringify(list.map(function (item) {
          return item.path + ': ' + item.message;
        })));
    }
    return found;
  }

  function expectNone(list, path, pattern, label) {
    var found = findAt(list, path, pattern);
    if (found) {
      throw new Error((label || 'unexpected problem') + ' at ' + path + ': ' + found.message);
    }
  }

  function baseModel(rows, extra) {
    return H.buildModel(rows, Object.assign({
      seed: 'test-seed',
      sheet: 'test-sheet',
      source: 'test-source',
      dateOrder: 'dmy',
      catalog: null,
      nameUnits: {},
      nameTargets: {}
    }, extra || {}));
  }

  function exercise(id, name, extra) {
    return Object.assign({
      id: id,
      name: name,
      primaryMuscle: null,
      secondaryMuscles: [],
      equipment: null,
      movementPattern: null,
      createdAt: 1000,
      updatedAt: 1000,
      deletedAt: null
    }, extra || {});
  }

  function catalog(exercises, extra) {
    return Object.assign({
      schemaVersion: 5,
      exportedAt: 1000,
      exercises: exercises || [],
      sessions: [],
      sessionExercises: [],
      sets: []
    }, extra || {});
  }

  function row(overrides) {
    return Object.assign({
      date: '24-10-2025',
      exercise: 'Bench Press',
      reps: 5,
      weight: 100,
      unit: 'kg'
    }, overrides || {});
  }

  function blockOf(model, sessionIndex, blockIndex) {
    return model.sessions[sessionIndex || 0].blocks[blockIndex || 0];
  }

  function setOf(model, sessionIndex, blockIndex, setIndex) {
    return blockOf(model, sessionIndex, blockIndex).sets[setIndex || 0];
  }

  function sampleRows() {
    return [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 10, weight: 40, unit: 'kg', type: 'W' },
      { date: null, exercise: null, reps: 8, weight: 60, rpe: 7, type: 'W' },
      { date: null, exercise: null, reps: 5, weight: 80, rpe: 8, type: 'N' },
      { date: null, exercise: 'Squat', reps: 10, weight: 50, type: 'W' },
      { date: null, exercise: null, reps: 5, weight: 100, rpe: 8 }
    ];
  }

  function builtFile() {
    var model = baseModel(sampleRows());
    var exported = H.buildExport(model, { exportedAt: 1700000000000 });
    if (!exported.ok) {
      throw new Error('the sample did not export: ' + JSON.stringify(exported.problems));
    }
    return exported.file;
  }

  /* ------------------------------------------------------------------ *
   * FNV-1a and identifiers
   * ------------------------------------------------------------------ */

  check('fnv1a64 matches the published vectors', function () {
    eq(H.fnv1a64Hex(''), 'cbf29ce484222325');
    eq(H.fnv1a64Hex('a'), 'af63dc4c8601ec8c');
    eq(H.fnv1a64Hex('foobar'), '85944171f73967e8');
  });

  check('ids have the imp_ prefix and sixteen lowercase hex characters', function () {
    ok(/^imp_[0-9a-f]{16}$/.test(H.makeExerciseId('Cable Fly')), 'exercise id shape');
    ok(/^imp_[0-9a-f]{16}$/.test(H.makeSessionId('s', 's', 1)), 'session id shape');
    ok(/^imp_[0-9a-f]{16}$/.test(H.makeSetId('s', 's', 1)), 'set id shape');
    ok(/^imp_[0-9a-f]{16}$/.test(H.makeSessionExerciseId('s', 's', 1, 1)), 'session exercise id shape');
  });

  check('exercise ids key on the normalised name only', function () {
    eq(H.makeExerciseId('Cable Fly'), H.makeExerciseId('  cable   fly '));
    eq(H.makeExerciseId('Cable Fly'), H.makeExerciseId('CABLE FLY'));
    ok(H.makeExerciseId('Cable Fly') !== H.makeExerciseId('Cable Row'), 'different names differ');
  });

  check('session, set and session-exercise ids are deterministic and distinct', function () {
    eq(H.makeSessionId('a', 'b', 3), H.makeSessionId('a', 'b', 3));
    ok(H.makeSessionId('a', 'b', 3) !== H.makeSessionId('a', 'b', 4), 'row changes the session id');
    ok(H.makeSessionId('a', 'b', 3) !== H.makeSessionId('c', 'b', 3), 'seed changes the session id');
    ok(H.makeSetId('a', 'b', 3) !== H.makeSetId('a', 'b', 4), 'row changes the set id');
    ok(H.makeSetId('a', 'b', 3) !== H.makeSessionId('a', 'b', 3), 'kinds differ');
    ok(H.makeSessionExerciseId('a', 'b', 3, 1) !== H.makeSessionExerciseId('a', 'b', 3, 2),
      'position changes the session exercise id');
  });

  check('the same name is one exercise across revisions, while sessions re-key', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Cable Fly', reps: 10, weight: 20, unit: 'kg' }
    ];
    var first = H.buildExport(baseModel(rows, { seed: 'revision-one' }), { exportedAt: 1 });
    var second = H.buildExport(baseModel(rows, { seed: 'revision-two' }), { exportedAt: 1 });
    eq(first.file.exercises[0].id, second.file.exercises[0].id);
    ok(first.file.sessions[0].id !== second.file.sessions[0].id, 'sessions re-key with the revision');
    ok(first.file.sets[0].id !== second.file.sets[0].id, 'sets re-key with the revision');
  });

  /* ------------------------------------------------------------------ *
   * Dates and times
   * ------------------------------------------------------------------ */

  check('date formats: DD-MM-YYYY, DD/MM/YYYY, DD.MM.YYYY and ISO', function () {
    ['24-10-2025', '24/10/2025', '24.10.2025', '2025-10-24'].forEach(function (text) {
      var parsed = H.parseDateValue(text, 'dmy');
      ok(parsed.ok, text + ' should parse');
      eq(parsed.iso, '2025-10-24', text);
      eq(parsed.ambiguous, false, text + ' is unambiguous');
    });
  });

  check('two-digit years are refused', function () {
    var parsed = H.parseDateValue('24-10-25', 'dmy');
    eq(parsed.ok, false);
    ok(/two-digit/.test(parsed.error), parsed.error);
  });

  check('impossible days and months are rejected, leap years included', function () {
    eq(H.parseDateValue('31-04-2025', 'dmy').ok, false);
    eq(H.parseDateValue('2025-02-29', 'dmy').ok, false);
    eq(H.parseDateValue('2024-02-29', 'dmy').ok, true);
    eq(H.parseDateValue('2025-13-01', 'dmy').ok, false);
    eq(H.parseDateValue('00-01-2025', 'dmy').ok, false);
    eq(H.parseDateValue('01-00-2025', 'dmy').ok, false);
  });

  check('blank dates are empty rather than errors', function () {
    var parsed = H.parseDateValue('   ', 'dmy');
    eq(parsed.ok, false);
    eq(parsed.empty, true);
    eq(H.parseDateValue(null, 'dmy').empty, true);
  });

  check('the ambiguity guard marks only month-and-day-ambiguous dates', function () {
    var ambiguous = H.parseDateValue('05-03-2025', 'dmy');
    eq(ambiguous.ok, true);
    eq(ambiguous.ambiguous, true);
    eq(ambiguous.day, 5);
    eq(ambiguous.month, 3);
    eq(H.parseDateValue('24-10-2025', 'dmy').ambiguous, false);
    eq(H.parseDateValue('2025-03-05', 'dmy').ambiguous, false);
    eq(H.parseDateValue('13-02-2025', 'dmy').ambiguous, false);
  });

  check('the MDY reading swaps the first two components', function () {
    var us = H.parseDateValue('05-03-2025', 'mdy');
    eq(us.day, 3);
    eq(us.month, 5);
    eq(us.ambiguous, true);
    var impossible = H.parseDateValue('24-10-2025', 'mdy');
    eq(impossible.ok, false);
  });

  check('time parsing defaults to 12:00 and rejects nonsense', function () {
    var parsed = H.parseTimeValue('07:30');
    eq(parsed.ok, true);
    eq(parsed.hh, 7);
    eq(parsed.mm, 30);
    eq(H.parseTimeValue(null).hh, 12);
    eq(H.parseTimeValue(null).mm, 0);
    eq(H.parseTimeValue('25:00').ok, false);
    eq(H.parseTimeValue('07:61').ok, false);
    eq(H.parseTimeValue('noon').ok, false);
  });

  check('local epoch millis match the Date constructor', function () {
    var ms = H.localEpochMillis(2025, 10, 24, 12, 0);
    eq(ms, new Date(2025, 9, 24, 12, 0, 0, 0).getTime());
    var early = H.localEpochMillis(1969, 6, 15, 8, 30);
    eq(early, new Date(1969, 5, 15, 8, 30, 0, 0).getTime());
  });

  check('the zone offset is minutes east of UTC', function () {
    var ms = H.localEpochMillis(2025, 10, 24, 12, 0);
    eq(H.zoneOffsetMinutesFor(ms), -new Date(ms).getTimezoneOffset());
    eq(H.zoneOffsetFromGetTimezoneOffset(-120), 120);
    eq(H.zoneOffsetFromGetTimezoneOffset(180), -180);
    eq(H.zoneOffsetFromGetTimezoneOffset(0), 0);
  });

  check('future and pre-1970 dates are recognised by calendar day', function () {
    eq(H.isFutureDate(2099, 1, 1), true);
    eq(H.isFutureDate(1969, 12, 31), false);
    eq(H.isFutureDate(2020, 1, 1), false);
  });

  /* ------------------------------------------------------------------ *
   * Units and roles
   * ------------------------------------------------------------------ */

  check('unit conversion stores whole grams', function () {
    eq(H.unitToGrams(100, 'kg'), 100000);
    eq(H.unitToGrams(0.5, 'kg'), 500);
    eq(H.unitToGrams(0, 'kg'), 0);
    eq(H.unitToGrams(225, 'lb'), 102058);
    eq(H.unitToGrams(1, 'lb'), 454);
    close(H.gramsToUnit(102058, 'lb'), 225, 0.001);
    eq(H.formatWeight(102058, 'lb'), '225.0');
    eq(H.weightUnitName('lb'), 'POUNDS');
    eq(H.weightUnitName('kg'), 'KILOGRAMS');
  });

  check('unit names are read case-insensitively and unknown names are refused', function () {
    eq(H.parseUnit('KG'), 'kg');
    eq(H.parseUnit('kgs'), 'kg');
    eq(H.parseUnit('lbs'), 'lb');
    eq(H.parseUnit('Pounds'), 'lb');
    eq(H.parseUnit(''), null);
    eq(H.parseUnit(null), null);
    eq(H.parseUnit('stone'), false);
  });

  check('role aliases map to the stored set types', function () {
    ['W', 'U', 'warmup', 'warm-up', 'warm'].forEach(function (text) {
      eq(H.normalizeRole(text).role, 'WARMUP', text);
    });
    ['N', 'work', 'working', 'normal'].forEach(function (text) {
      eq(H.normalizeRole(text).role, 'NORMAL', text);
    });
    eq(H.normalizeRole(null).role, 'NORMAL');
    eq(H.normalizeRole('').role, 'NORMAL');
    ['top', 'top set', '1rm'].forEach(function (text) {
      eq(H.normalizeRole(text).role, 'TOP_SET', text);
    });
    ['failure', 'F', 'AMRAP'].forEach(function (text) {
      eq(H.normalizeRole(text).role, 'FAILURE', text);
    });
  });

  check('drop and cluster are refused, and unknown types are flagged', function () {
    eq(H.normalizeRole('drop').role, 'DROP');
    eq(H.normalizeRole('drop').refused, true);
    eq(H.normalizeRole('cluster').role, 'CLUSTER');
    eq(H.normalizeRole('cluster').refused, true);
    eq(H.normalizeRole('S').recognised, false);
    eq(H.normalizeRole('S').role, 'NORMAL');
  });

  check('only work roles record effort', function () {
    eq(H.roleRecordsEffort('NORMAL'), true);
    eq(H.roleRecordsEffort('TOP_SET'), true);
    eq(H.roleRecordsEffort('FAILURE'), true);
    eq(H.roleRecordsEffort('WARMUP'), false);
    eq(H.roleRecordsEffort('DROP'), false);
    eq(H.roleRecordsEffort('CLUSTER'), false);
    eq(H.roleIsWork('WARMUP'), false);
    eq(H.roleIsWork('NORMAL'), true);
    eq(H.roleIsWork('DROP'), true);
  });

  /* ------------------------------------------------------------------ *
   * Grouping
   * ------------------------------------------------------------------ */

  check('acceptance 1: the specification example is one session, two blocks, five sets, three warm-ups', function () {
    var model = baseModel(sampleRows());
    eq(model.sessions.length, 1);
    eq(model.sessions[0].blocks.length, 2);
    eq(blockOf(model, 0, 0).sets.length, 3);
    eq(blockOf(model, 0, 1).sets.length, 2);
    eq(model.sessions[0].blocks[0].name, 'Bench Press');
    eq(model.sessions[0].blocks[1].name, 'Squat');
    eq(model.sessions[0].blocks[0].sets[0].reps, 10);
    eq(model.sessions[0].blocks[0].sets[2].weight, 80);
    eq(model.sessions[0].blocks[1].sets[1].weight, 100);
    eq(H.revalidateModel(model).problems.length, 0);
    var warmups = 0;
    model.sessions[0].blocks.forEach(function (block) {
      block.sets.forEach(function (set) { if (set.role === 'WARMUP') { warmups += 1; } });
    });
    /* The example's JSON marks three rows W (two Bench Press, one Squat);
     * the Testing section's prose says two. The literal type mapping is what
     * this asserts; see the report for the contradiction. */
    eq(warmups, 3);
  });

  check('setIndex counts from 1 including warm-ups', function () {
    var model = baseModel(sampleRows());
    eq(blockOf(model, 0, 0).sets[0].index, 1);
    eq(blockOf(model, 0, 0).sets[1].index, 2);
    eq(blockOf(model, 0, 0).sets[2].index, 3);
    eq(blockOf(model, 0, 1).sets[0].index, 1);
  });

  check('a fully blank row is skipped and resets nothing', function () {
    var rows = sampleRows();
    rows.splice(2, 0, {});
    rows.splice(4, 0, { date: null, exercise: null, reps: null, weight: null });
    var model = baseModel(rows);
    eq(model.skippedBlank, 2);
    eq(model.sessions.length, 1);
    eq(blockOf(model, 0, 0).sets.length, 3);
    eq(model.sessions[0].blocks[1].sets.length, 2);
  });

  check('a repeated explicit date starts a second session on the same day', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: '24-10-2025', exercise: 'Squat', reps: 5, weight: 120, unit: 'kg' }
    ];
    var model = baseModel(rows);
    eq(model.sessions.length, 2);
    eq(model.sessions[0].blocks[0].name, 'Bench Press');
    eq(model.sessions[1].blocks[0].name, 'Squat');
    expectAt(H.revalidateModel(model).warnings, 'sessions[1].startedAt', /overlaps/);
  });

  check('a blank exercise after a date change is a row problem, not a carry-over', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: '25-10-2025', exercise: null, reps: 5, weight: 100, unit: 'kg' }
    ];
    var model = baseModel(rows);
    eq(model.sessions.length, 2);
    eq(model.sessions[1].blocks.length, 1);
    eq(model.sessions[1].blocks[0].name, '');
    var problems = H.revalidateModel(model).problems;
    expectAt(problems, 'sessions[1].exercises[0].name', /No exercise yet/);
  });

  check('a blank exercise carries inside the session', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: null, exercise: null, reps: 5, weight: 110, unit: 'kg' }
    ];
    var model = baseModel(rows);
    eq(model.sessions[0].blocks.length, 1);
    eq(model.sessions[0].blocks[0].sets.length, 2);
  });

  check('a repeated exercise name continues one block', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: null, exercise: 'bench press', reps: 5, weight: 110, unit: 'kg' }
    ];
    var model = baseModel(rows);
    eq(model.sessions[0].blocks.length, 1);
    eq(model.sessions[0].blocks[0].sets.length, 2);
  });

  check('a different exercise starts a new block', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: null, exercise: 'Squat', reps: 5, weight: 120, unit: 'kg' }
    ];
    var model = baseModel(rows);
    eq(model.sessions[0].blocks.length, 2);
    eq(model.sessions[0].blocks[1].sets.length, 1);
  });

  check('a clean value carried from the row above wins, and a blank type is normal', function () {
    var rows = [
      { date: '24-10-2025', exercise: 'Bench Press', reps: 5, weight: 100, unit: 'kg' },
      { date: null, exercise: null, reps: 5, weight: 100, unit: null, type: null }
    ];
    var model = baseModel(rows);
    eq(setOf(model, 0, 0, 1).role, 'NORMAL');
    eq(setOf(model, 0, 0, 1).unit, 'kg');
  });

  check('an explicit date at the start of the file opens a session; a missing one is a problem', function () {
    var model = baseModel([{ date: null, exercise: 'Squat', reps: 5, weight: 100, unit: 'kg' }]);
    eq(model.sessions.length, 1);
    expectAt(H.revalidateModel(model).problems, 'sessions[0].startedAt', /No date yet/);
  });

  check('nested sessions flatten to the same model', function () {
    var document = {
      source: 'nested',
      sessions: [
        {
          date: '24-10-2025',
          exercises: [
            { name: 'Bench Press', sets: [{ reps: 5, weight: 100, unit: 'kg' }, { reps: 5, weight: 110, unit: 'kg' }] },
            { name: 'Squat', sets: [{ reps: 5, weight: 120, unit: 'kg' }] }
          ]
        }
      ]
    };
    var parsed = H.parseInputText(JSON.stringify(document), { fileName: 'nested.json' });
    eq(parsed.kind, 'rows');
    eq(parsed.rows.length, 3);
    var model = baseModel(parsed.rows, { source: parsed.source });
    eq(model.sessions.length, 1);
    eq(model.sessions[0].blocks.length, 2);
    eq(blockOf(model, 0, 0).sets.length, 2);
    eq(blockOf(model, 0, 1).sets.length, 1);
    eq(model.source, 'nested');
  });

  check('nested sessions on the same day stay two sessions', function () {
    var document = {
      sessions: [
        { date: '24-10-2025', exercises: [{ name: 'Bench', sets: [{ reps: 5, weight: 100, unit: 'kg' }] }] },
        { date: '24-10-2025', exercises: [{ name: 'Squat', sets: [{ reps: 5, weight: 120, unit: 'kg' }] }] }
      ]
    };
    var parsed = H.parseInputText(JSON.stringify(document), { fileName: 'two.json' });
    var model = baseModel(parsed.rows);
    eq(model.sessions.length, 2);
  });

  check('numeric strings are coerced', function () {
    var model = baseModel([
      { date: '24-10-2025', exercise: 'Squat', reps: '8', weight: '100.5', rpe: '7.5', unit: 'kg' }
    ]);
    eq(setOf(model).reps, 8);
    eq(setOf(model).weight, 100.5);
    eq(setOf(model).rpe, 7.5);
    eq(H.revalidateModel(model).problems.length, 0);
  });

  check('time and duration flow into startedAt and finishedAt', function () {
    var model = baseModel([
      row({ date: '24-10-2025', time: '06:30', durationMinutes: 90 })
    ]);
    var expected = H.localEpochMillis(2025, 10, 24, 6, 30);
    eq(model.sessions[0].startedAt, expected);
    eq(model.sessions[0].finishedAt, expected + 90 * 60000);
    eq(model.sessions[0].zoneOffsetMinutes, H.zoneOffsetMinutesFor(expected));
    eq(model.sessions[0].hh, 6);
    eq(model.sessions[0].mm, 30);
  });

  check('weightKg and weightLb state their own unit; zoneOffsetMinutes is accepted', function () {
    var kilos = baseModel([row({ weight: null, weightKg: 80 })]);
    eq(setOf(kilos).weight, 80);
    eq(setOf(kilos).unit, 'kg');
    var pounds = baseModel([row({ weight: null, weightLb: 225 })]);
    eq(setOf(pounds).weight, 225);
    eq(setOf(pounds).unit, 'lb');
    var built = H.buildExport(pounds, { exportedAt: 1 });
    eq(built.file.sets[0].weightGrams, 102058);
    var offset = baseModel([row({ zoneOffsetMinutes: 120 })]);
    var unknown = H.revalidateModel(offset).warnings.filter(function (warning) {
      return /Unrecognised key/.test(warning.message);
    });
    eq(unknown.length, 0);
  });

  check('an unknown top-level key warns', function () {
    var parsed = H.parseInputText(JSON.stringify({
      source: 'x',
      rows: [row({})],
      extra: 1
    }), {});
    ok(parsed.warnings.some(function (warning) {
      return warning.path === 'document.extra';
    }), 'top-level warning');
  });

  check('unreadable numbers are reported, and a heading with no sets blocks', function () {
    var unreadable = baseModel([
      { date: '24-10-2025', exercise: 'Squat', reps: 'eight', weight: 'heavy', unit: 'kg' }
    ]);
    expectAt(H.revalidateModel(unreadable).problems,
      'sessions[0].exercises[0].sets[0].reps', /not a number/);
    expectAt(H.revalidateModel(unreadable).problems,
      'sessions[0].exercises[0].sets[0].weight', /not a number/);
    // A row with an exercise but no reps and no weight is a heading, not a set
    // (N162), so the block itself is what has nothing in it.
    var heading = baseModel([{ date: '24-10-2025', exercise: 'Squat' }]);
    expectAt(H.revalidateModel(heading).problems,

    file.sets.forEach(function (set) {

  check('acceptance 7: re-importing the same revision adds nothing', function () {
    var first = builtFile();

  check('acceptance 8: the same input produces the same file apart from exportedAt', function () {
    var first = H.buildExport(baseModel(sampleRows()), { exportedAt: 111 });

  check('the file is pretty-printed with two spaces and round-trips', function () {

  check('a pound name creates POUNDS, a kilogram name KILOGRAMS', function () {

  check('stats count what will be added and what will be skipped', function () {

  /* ------------------------------------------------------------------ *
   * The review's fixes (B173–B175, N161–N163)
   * ------------------------------------------------------------------ */

  check('ids separate two lists on the same row but different dates (B173)', function () {
    var jan = H.buildExport(baseModel([
      { date: '2024-01-01', exercise: 'Squat', reps: 5, weight: 100, unit: 'kg' }
    ]), { exportedAt: 0 }).file;
    var feb = H.buildExport(baseModel([
      { date: '2024-02-02', exercise: 'Squat', reps: 5, weight: 100, unit: 'kg' }
    ]), { exportedAt: 0 }).file;

    eq(H.makeSessionId('s', 'x', 1, '2024-01-01'), H.makeSessionId('s', 'x', 1, '2024-01-01'));
  });

  check('two lists stay separate, and a combine joins one date (N161)', function () {
    var rows = [
      { __source: 0, date: '2024-03-04', exercise: 'Bench', reps: 5, weight: 100, unit: 'kg' },
      { __source: 1, date: '2024-03-04', exercise: 'Squat', reps: 5, weight: 120, unit: 'kg' },

    ];

    var separate = H.buildModel(rows, { sources: sources });
    eq(separate.sessions.length, 3);
    var combined = H.buildModel(rows, { sources: sources, combineDates: ['2024-03-04'] });
    eq(combined.sessions.length, 2);
    eq(combined.sessions[0].blocks.length, 2);
    var file = H.buildExport(combined, { exportedAt: 0 }).file;

  check('a date-only row and an exercise heading add no set (N162)', function () {
    var model = baseModel([
      { date: '2024-05-01', notes: 'felt tired' },
      { exercise: 'Squat', notes: 'belt on' },

    eq(model.sessions[0].blocks.length, 1);
    eq(model.sessions[0].blocks[0].sets.length, 1);
    eq(model.sessions[0].notes, 'felt tired\nbelt on');
    var result = H.buildExport(model, { exportedAt: 0 });
    eq(result.ok, true);
    eq(result.file.sessions[0].notes, 'felt tired\nbelt on');
  });

  check('a stated zone offset is kept and validated (N163)', function () {
    var stated = baseModel([
      { date: '2024-06-01', exercise: 'Squat', reps: 5, weight: 100, unit: 'kg', zoneOffsetMinutes: 120 }
    ]);
    eq(stated.sessions[0].zoneOffsetMinutes, 120);
    eq(stated.sessions[0].manualOffset, true);
    eq(H.buildExport(stated, { exportedAt: 0 }).file.sessions[0].zoneOffsetMinutes, 120);
    var bad = baseModel([
      { date: '2024-06-01', exercise: 'Squat', reps: 5, weight: 100, unit: 'kg', zoneOffsetMinutes: 9999 }
    ]);

  });

  check('an epoch-millisecond date is read (B175)', function () {
    var parsed = H.parseDateValue(Date.UTC(2024, 2, 4, 12), 'dmy');
    eq(parsed.ok, true);
    eq(parsed.iso, '2024-03-04');
    var model = baseModel([
      { date: Date.UTC(2024, 2, 4, 12), exercise: 'Squat', reps: 5, weight: 100, unit: 'kg' }
    ]);
    eq(model.sessions[0].date.iso, '2024-03-04');
  });

  check('sessions are written in date order (B174)', function () {
    var model = baseModel([
      { date: '2024-06-02', exercise: 'Squat', reps: 5, weight: 100, unit: 'kg' },

  /* ------------------------------------------------------------------ *
   * One lift's progress (N165)
   * ------------------------------------------------------------------ */

  check("the estimate is the app's, with its rounding and its ceiling (N165)", function () {
    eq(H.estimatedOneRepMax(100000, 5), 116500);
    eq(H.estimatedOneRepMax(100000, 1), 100000);
    eq(H.estimatedOneRepMax(100000, 12), 140000);
    eq(H.estimatedOneRepMax(100000, 13), null);

  check('a program sheet becomes a document the app imports (N167)', function () {
    var text = [
      ['Program', 'Day', 'Weekday', 'Exercise', 'Sets', 'Reps', 'Load', 'Rest', 'RPE', 'Note'].join('\t'),
      ['Autumn block', 'Upper A', 'Mon', 'Competition Bench Press', '5', '3', '82.5', '180', '8', 'pause 1s'].join('\t'),
      ['Autumn block', 'Upper A', 'Mon', 'Barbell Row', '4', '6-8', '70', '120', '8', ''].join('\t'),
      ['Autumn block', 'Upper A', 'Wed', 'Competition Bench Press', '5', '3', '82.5', '180', '8', ''].join('\t'),
      ['Autumn block', 'Lower A', 'Fri', 'Back Squat', '5', '5', '100', '240', '8', 'belts on'].join('\t'),

    ].join('\n');

    eq(parsed.problems.length, 0);

    eq(parsed.days.length, 2);
    eq(parsed.days[0].weekdays.join(','), 'MONDAY,WEDNESDAY');

    var built = H.buildProgramDocument(parsed, {
      exportedAt: 1790000000000,

    });

    eq(built.stats.sets, 22);

    eq(built.document.formatVersion, 4);
    eq(built.document.program.name, 'Autumn block');
    eq(built.document.program.isActive, false);
    eq(built.document.slots.length, 3);
    eq(built.document.templates.length, 2);
    eq(built.document.templateExercises.length, 5);
    eq(built.document.templateSets.length, 22);
    eq(built.document.templateSets[0].targetWeightGrams, 82500);
    eq(built.document.templateSets[0].targetRepsMin, 3);
    eq(built.document.templateSets[0].targetRepsMax, 3);
    eq(built.document.templateSets[5].targetRepsMin, 6);
    eq(built.document.templateSets[5].targetRepsMax, 8);
    eq(built.document.templateExercises[0].targetRpeHalves, 16);
    eq(built.document.templateExercises[0].restSeconds, 180);
    ok(built.document.exercises.some(function (row) { return row.id === 'competition-bench-press'; }),
      'a seeded name keeps its slug');

    var again = H.buildProgramDocument(H.parseProgramSheet(text), {

  check('a program sheet refuses a bad row (N167)', function () {
    var parsed = H.parseProgramSheet(['Day\tExercise\tSets\tReps', 'Upper\tBench Press\tx\t5'].join('\n'));
    ok(parsed.problems.length > 0, 'a non-numeric set count should be refused');
  });

  check('a same-name program is a no-op or a second one, and the note says which (B180)', function () {
    // The document's identity is its program id, which the page derives from the name. The app ends the
    // merge on a live id, restores a deleted one, and adds a program only when the id is new — so the
    // old note's "it will add a second one" was wrong for the two cases that matter.
    var document = { program: { id: 'pgm_x', name: 'Autumn block' } };
    function note(programs) {
      return H.programClashNote(document, { programs: programs }) || '';
    }

    ok(note([{ id: 'pgm_x', name: 'Autumn block', deletedAt: null }]).indexOf('adds nothing') !== -1,
      'a live id adds nothing');
    ok(note([{ id: 'pgm_x', name: 'Autumn block', deletedAt: 5 }]).indexOf('brings it back') !== -1,
      'a hidden id is restored');
    ok(note([{ id: 'pgm_y', name: 'Autumn block', deletedAt: null }]).indexOf('second one') !== -1,
      'a different id with the same name is a second program');
    eq(note([{ id: 'pgm_y', name: 'Other', deletedAt: null }]), '');
    eq(H.programClashNote(document, { seeded: true, exercises: [] }), null);
  });

  check('the export snapshot is read-only and newest first (N165)', function () {
    var backup = {
      exercises: [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }],

        { id: 's1', startedAt: 1000 },

        { id: 's3', startedAt: 3000, deletedAt: 5 }
      ],
      sessionExercises: [
        { id: 'e1', sessionId: 's1', exerciseId: 'a', position: 1 },

        { id: 'x1', sessionExerciseId: 'e1', reps: 5, weightGrams: 100000, setType: 'NORMAL' },
        { id: 'x2', sessionExerciseId: 'e2', reps: 5, weightGrams: 50000, setType: 'WARMUP' },
        { id: 'x3', sessionExerciseId: 'e2', reps: 5, weightGrams: 80000, setType: 'NORMAL' }

    var snapshot = H.exportSnapshot(backup);
    eq(snapshot.live, 2);
    eq(snapshot.deleted, 1);
    eq(snapshot.sessions[0].id, 's2');
    eq(snapshot.sessions[1].id, 's1');
    eq(snapshot.sessions[0].tonnage, 400000);
    eq(snapshot.sessions[0].blocks.length, 1);
    eq(snapshot.first, 1000);
    eq(snapshot.last, 2000);

  check('a Waistline backup becomes daily measurements (N166)', function () {
    var doc = {
      settings: { bodyStatsUnits: { weight: 'lb' } },
      diary: [
        { date: '2026-01-02', stats: { weight: 180.5, 'body fat': 18.2, waist: 90 } },
        { date: '2026-01-01', stats: { weight: 182, muscle: 41.3 } },
        { date: '2026-01-03', stats: { waist: 89 } }

    var parsed = H.parseWaistlineDoc(doc);
    eq(parsed.unit, 'lb');
    eq(parsed.days.length, 2);

    eq(parsed.ignored[0], 'waist');
    eq(parsed.skippedDays, 1);

    var measurements = H.waistlineMeasurements(parsed, parsed.unit, 1700000000000);

    eq(measurements[0].muscleTenths, 413);
    eq(measurements[0].bodyFatTenths, null);
    eq(measurements[0].measuredAt, H.noonOfDate('2026-01-01'));
    eq(measurements[1].weightGrams, 81873);
    eq(measurements[1].bodyFatTenths, 182);
    eq(measurements[1].waistMm, null);
    eq(measurements[0].id, H.waistlineMeasurements(parsed, parsed.unit, 1)[0].id);
    ok(measurements[0].id.indexOf('mes_') === 0, 'the id should be namespaced');
  });

  check("the tool's series equals the app's for the progress fixture (N165)", function () {
    var fixture = window.PROGRESS_FIXTURE;
    ok(fixture && Array.isArray(fixture.expected), 'the progress fixture did not load');
    var points = H.liftTrendPoints(fixture, fixture.exerciseId);
    eq(points.length, fixture.expected.length);
    points.forEach(function (point, index) {
      var expected = fixture.expected[index];
      eq(point.startedAt, expected.startedAt);
      eq(point.heaviestSetGrams, expected.heaviestSetGrams);
      eq(point.estimatedOneRepMaxGrams, expected.estimatedOneRepMaxGrams);
    });
  });

  check('the series and the picker read the same live rows the app does (B179)', function () {
    // A soft-deleted row keeps its id and rides in the export, but the app's trend query filters
    // `deletedAt IS NULL` on the session, the exercise and the set, and requires `finishedAt`.
    // A deleted 999 kg typo therefore must not become the chart's best session here.
    var backup = {
      exercises: [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }],
      sessions: [
        { id: 's1', startedAt: 1000, finishedAt: 2000 },
        { id: 's2', startedAt: 3000, finishedAt: 4000 },
        { id: 's3', startedAt: 5000, finishedAt: 6000, deletedAt: 9 },
        { id: 's4', startedAt: 7000 }
      ],
      sessionExercises: [
        { id: 'e1', sessionId: 's1', exerciseId: 'a' },
        { id: 'e2', sessionId: 's2', exerciseId: 'a' },
        { id: 'e3', sessionId: 's3', exerciseId: 'a' },
        { id: 'e4', sessionId: 's4', exerciseId: 'a' },
        { id: 'e5', sessionId: 's1', exerciseId: 'b', deletedAt: 3 }
      ],
      sets: [
        { sessionExerciseId: 'e1', weightGrams: 100000, reps: 5, setType: 'NORMAL' },
        { sessionExerciseId: 'e2', weightGrams: 90000, reps: 5, setType: 'NORMAL' },
        { sessionExerciseId: 'e3', weightGrams: 200000, reps: 5, setType: 'NORMAL' },
        { sessionExerciseId: 'e4', weightGrams: 300000, reps: 5, setType: 'NORMAL' },
        { sessionExerciseId: 'e2', weightGrams: 999000, reps: 5, setType: 'NORMAL', deletedAt: 7 },
        { sessionExerciseId: 'e5', weightGrams: 80000, reps: 5, setType: 'NORMAL' }
      ]
    };

    var points = H.liftTrendPoints(backup, 'a');
    eq(points.length, 2);
    eq(points[0].heaviestSetGrams, 100000);
    eq(points[1].heaviestSetGrams, 90000);

    var movements = H.movementsWithHistory(backup);
    eq(movements.length, 1);
    eq(movements[0].id, 'a');
    eq(movements[0].sets, 2);

    var snapshot = H.exportSnapshot(backup);
    eq(snapshot.live, 3);
    eq(snapshot.deleted, 1);
    var s1 = snapshot.sessions.filter(function (session) { return session.id === 's1'; })[0];
    eq(s1.blocks.length, 1, 'a deleted exercise must not show under a live session');
  });

  /* ------------------------------------------------------------------ *
   * Report
   * ------------------------------------------------------------------ */

  function render() {
    var summary = document.getElementById('testSummary');
    if (summary) {
      summary.textContent = passes + ' passed, ' + failures + ' failed' +
        (failures === 0 ? ' — all assertions hold.' : '.');
      summary.className = 'test-summary ' + (failures === 0 ? 'test-pass' : 'test-fail');
    }
    var list = document.getElementById('testResults');
    if (list) {
      list.textContent = '';
      results.forEach(function (result) {
        var item = document.createElement('li');
        item.className = result.ok ? 'test-ok' : 'test-failed';
        item.textContent = (result.ok ? 'PASS  ' : 'FAIL  ') + result.name +
          (result.ok ? '' : ' — ' + result.error);
        list.appendChild(item);
      });
    }
    var rerun = document.getElementById('rerun');
    if (rerun) {
      rerun.addEventListener('click', function () { window.location.reload(); });
    }
    document.title = failures === 0
      ? 'PASS ' + passes + ' — import helper tests'
      : 'FAIL ' + failures + ' — import helper tests';
  }

  if (typeof document !== 'undefined' && document.getElementById('testSummary')) {
    render();
  } else if (typeof window !== 'undefined') {
    window.__testResults = { passes: passes, failures: failures, results: results };
  }
})();
