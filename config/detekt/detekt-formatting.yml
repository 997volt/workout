# detekt-formatting, loaded by `detektFormattingCheck` (ROADMAP N129).
#
# B123 settled that the formatting ruleset stays out of the gate, because loading it reports
# findings across the tree (DECISIONS.md's Process section carries the count and the command) — a
# repository-wide reformat, or a set of `active: false` entries that would be the silent gate
# detekt.yml's header forbids. What it left open is the trigger that decision
# named: a layout defect that ships because a review missed it where a tool would have caught it.
#
# A **separate file** is what makes the middle path possible. The rules live here so they can be loaded
# on their own — by tools/format-changed.py, over the files a change touches, and only on the lines
# that change added or rewrote — without turning them on for every file in the repository, which is
# the reformat B123 rejected. detekt.yml keeps every rule it has, and switches this ruleset off
# explicitly so the gate's own run is unchanged.
#
# A rule belongs here when the repository already satisfies it, or when its every finding today is a
# defect worth fixing. The measurement is `./gradlew :app:detektFormattingCheck`, which reports the
# whole tree; the counts are in DECISIONS.md (N129).

formatting:
  active: true
  # The Kotlin/Android code-style conventions, off by default: this is a Kotlin codebase, and the
  # Android variant would fight the Compose layout the rest of this file describes.
  android: false
